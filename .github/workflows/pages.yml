name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build staging preview (noindex)
        run: npm run build
        env:
          VITE_SITE_URL: ''
          VITE_GA_ID: ''
      - name: Verify Actions is the only Pages publishing source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type)" != "workflow" ]; then
            echo "::error::Select GitHub Actions in repository Settings > Pages > Source. Branch publishing overwrites the compiled website."
            exit 1
          fi
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published styles, scripts and images
        run: node scripts/check-deployed.mjs "${{ steps.deployment.outputs.page_url }}"
